[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolglass-scout"
version = "0.1.0"
description = "A bounded Strands Agents pipeline for evidence-backed software scouting."
requires-python = ">=3.10"
dependencies = ["strands-agents>=1.55,<2"]

[project.scripts]
toolglass-scout = "toolglass_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
