name: Deploy Toolglass to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolglass-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate editorial metadata and test magazine selection
        run: |
          npm run radar:validate
          npm run magazine:test
          npx tsc --noEmit

      - name: Build static Toolglass
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          BUTTONDOWN_PUBLIC_USERNAME: ${{ vars.BUTTONDOWN_PUBLIC_USERNAME }}
          INDEXNOW_KEY: ${{ github.ref == 'refs/heads/main' && secrets.INDEXNOW_KEY || '' }}

      - name: Prepare pretty static routes
        run: npm run prepare:pages

      - name: Validate exported routes, artwork, archive and feeds
        run: npm run magazine:validate

      - name: Upload static export
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
