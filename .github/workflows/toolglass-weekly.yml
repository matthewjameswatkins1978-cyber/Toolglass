name: Toolglass Weekly

on:
  schedule:
    - cron: '17 10 * * 1'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run is isolated; nudge creates or updates the weekly issue
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - nudge
      candidate_url:
        description: Optional HTTPS candidate URL for this run
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: toolglass-weekly-editorial
  queue: max

jobs:
  intake:
    if: github.event_name != 'schedule' || vars.TOOLGLASS_WEEKLY_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      WEEKLY_CANDIDATE_URL: ${{ inputs.candidate_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Load candidate URLs from prior receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP"
          uk_date="$(TZ=Europe/London date +%F)"
          uk_day="$(TZ=Europe/London date +%u)"
          week_start="$(TZ=Europe/London date -d "$uk_date - $((uk_day - 1)) days" +%F)"
          while IFS= read -r number; do
            gh issue view "$number" --json body --jq '.body' | node -e 'let body=""; process.stdin.on("data", (chunk) => body += chunk); process.stdin.on("end", () => { const match = body.match(/## Durable receipt\s*```json\s*([\s\S]*?)```/); if (!match) return; try { const receipt = JSON.parse(match[1]); for (const item of receipt.selected_items || []) if (item.source_url) console.log(item.source_url); } catch { /* ignore malformed historical receipt */ } });'
          done < <(gh issue list --state all --search 'in:title "Toolglass Weekly week of"' --limit 1000 --json author,number,title --jq ".[] | select(.author.login == \"github-actions[bot]\") | select(.title != \"Toolglass Weekly week of $week_start\") | .number") | sort -u > "$RUNNER_TEMP/weekly-previous-urls.txt"
          delimiter="weekly_$(openssl rand -hex 12)"
          { echo "WEEKLY_PREVIOUS_URLS<<$delimiter"; cat "$RUNNER_TEMP/weekly-previous-urls.txt"; echo "$delimiter"; } >> "$GITHUB_ENV"
      - name: Run bounded weekly intake
        env:
          WEEKLY_MODE: ${{ github.event_name == 'schedule' && 'nudge' || inputs.mode || 'dry-run' }}
        run: node scripts/weekly/run.mjs --mode "$WEEKLY_MODE"
      - name: Upload weekly receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolglass-weekly-${{ github.run_id }}
          path: editorial/runs/
          if-no-files-found: error
          retention-days: 90

  nudge:
    needs: intake
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nudge')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolglass-weekly-${{ github.run_id }}
          path: editorial/runs/
      - name: Persist one idempotent weekly nudge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          receipt="$(find editorial/runs -maxdepth 1 -name 'toolglass-weekly-*.json' -type f -print -quit)"
          issue_title="Toolglass Weekly week of $(node -e "const r=require('./' + process.argv[1]); process.stdout.write(r.run_id.slice('toolglass-weekly-'.length))" "$receipt")"
          existing="$(gh issue list --state all --search 'Toolglass Weekly week of' --json number,title --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)"
          body_file="${receipt%.json}.md"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$issue_title" --body-file "$body_file"
          else
            gh issue create --title "$issue_title" --body-file "$body_file"
          fi