name: Toolglass Radar

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run offline validation and report only
        required: true
        default: true
        type: boolean
      force:
        description: Bypass the 48-hour due gate (never bypasses validation)
        required: false
        default: false
        type: boolean
      specific_url:
        description: Optional single public project URL for a future scout run
        required: false
        type: string
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate Radar content
        run: npm run radar:validate
      - name: Offline dry run
        run: npm run radar:dry-run
