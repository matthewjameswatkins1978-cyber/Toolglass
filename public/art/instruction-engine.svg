 <path d="M774 551l7 8 14-19" stroke="#244de8" fill="none"/>
</g>
<path d="M715 521h-32v-46" fill="none" stroke="#244de8" stroke-width="3"/>
<path d="M668 460l15-15 15 15-15 15z" fill="#f7f7f2" stroke="#151715" stroke-width="2"/>
<path d="M676 453l14 14m0-14-14 14" stroke="#151715" stroke-width="2"/>
<g fill="#244de8"><circle cx="155" cy="324" r="4"/><circle cx="1332" cy="182" r="4"/><circle cx="648" cy="650" r="4"/></g>
<g stroke="#151715" stroke-width="1" opacity=".45"><path d="M155 328v90h53M1332 186v65h-76M648 646v-44h-48" fill="none"/></g>
