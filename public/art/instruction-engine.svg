 <circle cx="1180" cy="439" r="5" fill="#244de8"/>
 <path d="M1070 463v35h-60m60 0h67" fill="none"/>
 <path d="M991 501h204l49 58H947z" fill="#e0e1d5"/>
 <path d="M985 519h211m-225 17h238m-200-22-13 31m42-31-7 31m37-31v31m31-31 8 31m20-31 15 31" stroke-width="1.5"/>
</g>
<!-- Return path: inspection is part of learning, with a deliberate refusal branch. -->
<path d="M1243 372c95 0 95 240-22 240H717c-71 0-71-91-14-91" fill="none" stroke="#244de8" stroke-width="4" marker-end="url(#arrow)"/>
<g stroke="#151715" fill="#f7f7f2" stroke-width="3">
 <circle cx="783" cy="552" r="35"/><circle cx="783" cy="552" r="22" fill="#e3e5d9"/>
