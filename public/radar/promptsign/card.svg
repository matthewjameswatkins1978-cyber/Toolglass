<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">PromptSign — Toolglass Radar</title><desc id="desc">An AI instruction file is signed, checked against identity and transparency records, then admitted to agent context.</desc><rect width="1200" height="630" fill="#191d1b"/><text x="72" y="76" fill="#c4ef66" font-family="monospace" font-size="20" letter-spacing="4">TOOLGLASS / RADAR / DESK REVIEW</text><text x="72" y="155" fill="#f1f0e9" font-family="Georgia,serif" font-size="64" font-weight="700">PROMPTSIGN</text><text x="72" y="205" fill="#b8c0b4" font-family="monospace" font-size="20">PROVENANCE FOR AGENT INSTRUCTIONS</text><rect x="86" y="280" width="250" height="180" rx="10" fill="#242a27" stroke="#aeb8e8" stroke-width="3"/><text x="115" y="325" fill="#f1f0e9" font-family="monospace" font-size="20">AGENTS.md</text><path d="M115 355h150M115 382h115M115 409h138" stroke="#aeb8e8" stroke-width="7"/><path d="M350 370h120" stroke="#c4ef66" stroke-width="4"/><path d="M455 356l24 14-24 14" fill="none" stroke="#c4ef66" stroke-width="4"/><circle cx="592" cy="370" r="90" fill="#242a27" stroke="#c4ef66" stroke-width="4"/><path d="M555 370l24 24 52-58" fill="none" stroke="#c4ef66" stroke-width="9"/><text x="535" y="495" fill="#b8c0b4" font-family="monospace" font-size="16">IDENTITY + LOG</text><path d="M690 370h120" stroke="#c4ef66" stroke-width="4"/><path d="M795 356l24 14-24 14" fill="none" stroke="#c4ef66" stroke-width="4"/><rect x="830" y="280" width="280" height="180" rx="10" fill="#c4ef66"/><text x="865" y="342" fill="#191d1b" font-family="monospace" font-size="21">AGENT CONTEXT</text><text x="865" y="390" fill="#191d1b" font-family="monospace" font-size="18">verified bundle</text><text x="72" y="575" fill="#b8c0b4" font-family="monospace" font-size="17">SIGNATURE ≠ SAFETY · IT PROVES WHO SHIPPED THIS EXACT THING</text></svg>