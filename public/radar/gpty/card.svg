<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">gPTY — Toolglass Radar</title><desc id="desc">Four tiled terminal panes expose structured control through JSON-RPC, CLI and MCP rather than screen scraping.</desc><rect width="1200" height="630" fill="#191d1b"/><text x="72" y="76" fill="#c4ef66" font-family="monospace" font-size="20" letter-spacing="4">TOOLGLASS / RADAR / DESK REVIEW</text><text x="72" y="155" fill="#f1f0e9" font-family="Georgia,serif" font-size="64" font-weight="700">gPTY</text><text x="72" y="205" fill="#b8c0b4" font-family="monospace" font-size="20">GODOT + RUST + ADDRESSABLE TERMINALS</text><g fill="#242a27" stroke="#aeb8e8" stroke-width="3"><rect x="75" y="270" width="255" height="115" rx="7"/><rect x="345" y="270" width="255" height="115" rx="7"/><rect x="75" y="400" width="255" height="115" rx="7"/><rect x="345" y="400" width="255" height="115" rx="7"/></g><g fill="#f1f0e9" font-family="monospace" font-size="18"><text x="100" y="310">T1  $ cargo test</text><text x="370" y="310">T2  agent</text><text x="100" y="440">T3  logs</text><text x="370" y="440">T4  inspector</text></g><g stroke="#c4ef66" stroke-width="4" fill="none"><path d="M625 390h150"/><path d="M760 376l24 14-24 14"/></g><rect x="800" y="268" width="310" height="247" rx="12" fill="#242a27" stroke="#c4ef66" stroke-width="3"/><g fill="#c4ef66" font-family="monospace" font-size="21"><text x="845" y="325">JSON-RPC</text><text x="845" y="380">CLI</text><text x="845" y="435">MCP</text></g><text x="845" y="475" fill="#b8c0b4" font-family="monospace" font-size="16">READ · WAIT · INJECT · STATUS</text><text x="72" y="575" fill="#b8c0b4" font-family="monospace" font-size="17">THE TERMINAL STOPS PRETENDING PIXELS ARE AN API</text></svg>